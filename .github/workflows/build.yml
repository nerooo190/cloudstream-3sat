name: Build and publish

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudstream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: bash ./gradlew :ThreeSat:testDebugUnitTest make makePluginsJson --no-daemon
      - name: Prepare repository files
        run: |
          mkdir -p dist
          cp ThreeSat/build/ThreeSat.cs3 build/plugins.json dist/
          python3 scripts/generate_repo.py --output dist/repo.json
      - uses: actions/upload-artifact@v4
        with:
          name: cloudstream-3sat
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cloudstream-3sat
          path: dist
      - name: Publish builds branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/three-sat-publish"
          if git ls-remote --exit-code --heads origin builds; then
            git fetch origin builds
            git worktree add --detach "$publish_dir" origin/builds
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan builds
            git -C "$publish_dir" rm -rf .
          fi
          cp dist/ThreeSat.cs3 dist/plugins.json dist/repo.json "$publish_dir/"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" add ThreeSat.cs3 plugins.json repo.json
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Build ${GITHUB_SHA}"
            git -C "$publish_dir" push origin HEAD:builds
          fi
